<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaker Transcript</title>
<style>
  :root{
    --bg:#101418; --panel:#171d23; --panel2:#1d252d; --line:#2a3540;
    --fg:#e6edf3; --dim:#8b98a5; --accent:#4cc2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:20px;margin:4px 0 2px;font-weight:650}
  h1 .sub{color:var(--dim);font-weight:400;font-size:14px;margin-left:8px}
  #drop{border:2px dashed var(--line);border-radius:14px;padding:42px 20px;text-align:center;color:var(--dim);cursor:pointer;transition:.15s;background:var(--panel)}
  #drop.hot{border-color:var(--accent);color:var(--fg);background:var(--panel2)}
  #drop b{color:var(--fg)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:18px;padding:16px}
  .meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--dim);font-size:13px;align-items:baseline}
  .meta .name{color:var(--fg);font-weight:600;font-size:15px}
  .badge{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:12px}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  .spk{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;white-space:nowrap}
  #timeline{width:100%;height:110px;display:block;border-radius:8px;background:var(--panel2)}
  #audio{width:100%;margin-top:10px}
  .seg{display:grid;grid-template-columns:64px 92px 1fr;gap:10px;align-items:baseline;padding:7px 4px;border-bottom:1px solid var(--line)}
  .seg:last-child{border-bottom:none}
  .seg time{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums;cursor:pointer}
  .seg time:hover{color:var(--accent)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .status{margin-top:18px;color:var(--dim);display:flex;gap:10px;align-items:center}
  .spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px}
  .hidden{display:none}
  .err{color:#ff7b72}
  .spk.rnbtn{cursor:pointer}
  .spk.rnbtn .rn{opacity:.55;font-weight:700;margin-left:2px}
  .spk.rnbtn:hover .rn{opacity:1}
  .rnin{width:120px;background:var(--bg);color:var(--fg);border:1px solid var(--accent);border-radius:6px;padding:0 6px;font:inherit;font-size:12px;outline:none}
  .tlwrap{position:relative;margin-top:10px}
  .ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.75);pointer-events:none;z-index:2;left:0}
  .seg{cursor:pointer}
  .seg.cur{background:#1f6feb2e;box-shadow:inset 3px 0 0 var(--accent)}
  .ctl{position:sticky;top:0;z-index:3;background:var(--panel);padding-bottom:8px}
  #segs{max-height:60vh;overflow-y:auto;scrollbar-width:thin}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ Speaker Transcript <span class="sub">local GPU · Nemotron-3-Diarization + Nemotron-3.5-ASR</span></h1>
  <div id="drop">Drop audio / video files here, or click to choose.<br><b>WAV · MP3 · M4A · FLAC · OGG · OPUS · MP4 · MKV · MOV · WEBM</b></div>
  <input id="file" type="file" class="hidden" accept="audio/*,video/*,.wav,.mp3,.m4a,.flac,.ogg,.opus,.mp4,.mkv,.mov,.webm,.aac,.wma,.amr,.aiff" multiple>

  <div id="status" class="status hidden"><div class="spin"></div><span id="statusText"></span></div>

  <div id="result" class="card hidden">
    <div class="ctl">
      <div class="meta">
      <span class="name" id="rName"></span>
      <span class="badge" id="rDur"></span>
      <span class="badge" id="rSpk"></span>
      <span class="badge" id="rTime"></span>
    </div>
    <div class="legend" id="legend"></div>
    <div class="tlwrap"><canvas id="timeline" width="940" height="110"></canvas><div id="ph" class="ph hidden"></div></div>
    <audio id="audio" controls class="hidden"></audio>
    <div class="toolbar">
      <button data-fmt="md">⬇ Markdown</button>
      <button data-fmt="txt">⬇ Text</button>
      <button data-fmt="json">⬇ JSON</button>
      <button data-fmt="srt">⬇ SRT</button>
      <button data-fmt="vtt">⬇ VTT</button>
      <button id="copy">⧉ Copy transcript</button>
    </div>
    </div>
    <div id="segs"></div>
  </div>
</div>
<script>
const COLORS = ["#4cc2ff","#f78166","#3fb950","#d2a8ff","#f2cc60","#ff7b9c","#2ee6d6","#b3db70"];
const $ = id => document.getElementById(id);
const drop = $("drop"), fileIn = $("file");
let poll = null;
let curId = null, curJob = null;
let follow = true, lastIdx = -1;

drop.onclick = () => fileIn.click();
fileIn.onchange = () => { uploadAll(fileIn.files); fileIn.value=""; };
["dragover","dragenter"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("hot"); }));
["dragleave","drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("hot"); }));
drop.addEventListener("drop", ev => uploadAll(ev.dataTransfer.files));

async function uploadAll(files){
  for (const f of files) {
    if (!validate(f)) continue;
    showStatus(`Uploading ${f.name} …`);
    const fd = new FormData();
    fd.append("file", f, f.name);
    try {
      const r = await fetch("/api/transcribe", {method:"POST", body:fd});
      if (!r.ok) throw new Error((await r.json()).detail || r.status);
      pollJob((await r.json()).job_id, f.name);
    } catch(e){ showStatus(`Failed: ${e.message}`, true); }
  }
}

function validate(f){
  const ok = /^(audio|video)\//.test(f.type) || /\.(wav|mp3|m4a|flac|ogg|opus|mp4|mkv|mov|webm|aac|wma|amr|aiff|mp2|mp4a)$/i.test(f.name);
  if (!ok) showStatus(`Skipped (unsupported): ${f.name}`, true);
  return ok;
}

const STAGES = {queued:"Queued…", converting:"Converting audio…", "loading-models":"Loading models (first run downloads weights)…", transcribing:"Transcribing on GPU…"};
function pollJob(id, name){
  if (poll) clearInterval(poll);
  let t0 = Date.now();
  poll = setInterval(async () => {
    let resp, j;
    try { resp = await fetch(`/api/jobs/${id}`); j = await resp.json(); }
    catch(e){ return; }
    if (!resp.ok) { clearInterval(poll); showStatus(`${name} — ${j.detail || ("HTTP " + resp.status)}`, true); return; }
    if (j.status === "queued" || j.status === "running" || !j.status) {
      const secs = Math.round((Date.now()-t0)/1000);
      showStatus(`${name} — ${STAGES[j.stage] || "Processing…"} (${secs}s)`);
    } else if (j.status === "error") {
      clearInterval(poll);
      showStatus(`${name} — Error: ${j.error}`, true);
    } else if (j.status === "done") {
      clearInterval(poll); hideStatus(); render(id, j);
    }
  }, 1000);
}

function spkColor(s){ return COLORS[(parseInt(s.split("_")[1],10)||0) % COLORS.length]; }
function spkName(s){ const l = curJob && (curJob.labels || {})[s]; if (l) return l; const m = String(s).match(/^(?:speaker|spk)[_ ](\d+)$/i); return m ? "Speaker "+m[1] : String(s); }
function fmtTime(t){ const m=Math.floor(t/60), s=(t%60); return `${m}:${s.toFixed(1).padStart(4,"0")}`; }

function render(id, job){
  curId = id; curJob = job;
  $("result").classList.remove("hidden");
  $("rName").textContent = job.name;
  $("rDur").textContent = `⏱ ${fmtTime(job.duration)} audio`;
  $("rSpk").textContent = `👤 ${job.speakers.length} speaker${job.speakers.length===1?"":"s"}`;
  $("rTime").textContent = `⚙ ${job.elapsed ?? "?"}s processing`;
  $("legend").innerHTML = job.speakers.map(s =>
    `<span class="spk rnbtn" data-spk="${s}" title="Click to rename" style="background:${spkColor(s)}22;color:${spkColor(s)};border:1px solid ${spkColor(s)}55">${escapeHtml(spkName(s))} <b class="rn">✎</b></span>`).join("");
  document.querySelectorAll("#legend .spk").forEach(el => el.onclick = () => renameBadge(el, el.dataset.spk));
  const audio = $("audio");
  if (job.has_media) { audio.src = `/media/${id}`; audio.classList.remove("hidden"); }
  else { audio.removeAttribute("src"); audio.classList.add("hidden"); }

  $("segs").innerHTML = job.segments.map(s => `
    <div class="seg" data-start="${s.start}">
      <time>${fmtTime(s.start)}</time>
      <span class="spk" style="background:${spkColor(s.speaker)}22;color:${spkColor(s.speaker)}">${escapeHtml(spkName(s.speaker))}</span>
      <span>${escapeHtml(s.text)}</span>
    </div>`).join("");
  document.querySelectorAll("#segs .seg").forEach(el => el.onclick = () => seekTo(parseFloat(el.dataset.start)));
  follow = true; lastIdx = -1; $("segs").scrollTop = 0; onTick();

  drawTimeline(job);
  document.querySelectorAll(".toolbar [data-fmt]").forEach(b => b.onclick = () => location.href = `/api/export/${id}?fmt=${b.dataset.fmt}`);
  $("copy").onclick = async () => {
    const text = job.segments.map(s => `[${fmtTime(s.start)}] ${spkName(s.speaker)}: ${s.text}`).join("\n");
    await navigator.clipboard.writeText(text);
    $("copy").textContent = "✓ Copied"; setTimeout(()=>$("copy").textContent="⧉ Copy transcript", 1500);
  };
}

function renameBadge(el, spk){
  if (el.querySelector("input") || !curJob) return;
  let done = false;
  const restore = () => { if (!done) { done = true; render(curId, curJob); } };
  el.innerHTML = `<input class="rnin" value="">`;
  el.onclick = null;
  const inp = el.querySelector("input");
  inp.value = spkName(spk);
  inp.focus(); inp.select();
  inp.onkeydown = ev => {
    ev.stopPropagation();
    if (ev.key === "Enter") { inp.onblur = null; done = false; commit(inp.value); }
    else if (ev.key === "Escape") restore();
  };
  inp.onblur = () => setTimeout(() => { if (!done) restore(); }, 120);
  async function commit(val){
    try {
      const r = await fetch(`/api/jobs/${curId}/rename`, {
        method: "POST",
        headers: {"content-type": "application/json"},
        body: JSON.stringify({speaker: spk, label: val}),
      });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || ("HTTP " + r.status));
      const j = await r.json();
      curJob.labels = j.labels;
    } catch (e) {
      showStatus(`Rename failed: ${e.message}`, true);
      setTimeout(hideStatus, 2500);
    }
    done = true; render(curId, curJob);
  }
}

function drawTimeline(job){
  const cv = $("timeline"), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 110;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const dur = Math.max(job.duration, 1e-6);
  const lanes = job.speakers, laneH = 9, gapY = (H-16-lanes.length*laneH)/Math.max(lanes.length-1,1);
  lanes.forEach((s,i) => {
    const y = 8 + i*(laneH+gapY);
    ctx.fillStyle = spkColor(s)+"33"; ctx.fillRect(0,y,W,laneH);
    ctx.fillStyle = spkColor(s);
    for (const seg of job.segments) if (seg.speaker===s)
      ctx.fillRect(seg.start/dur*W, y, Math.max(seg.end-seg.start,0.15)/dur*W, laneH);
    ctx.fillStyle = "#8b98a5"; ctx.font = "11px system-ui";
    ctx.fillText(spkName(s), 2, y-2 > 10 ? y-2 : y+9);
  });
  cv.onclick = ev => { const r=cv.getBoundingClientRect(); seekTo((ev.clientX-r.left)/r.width*dur); };
}

function seekTo(t){ const a = $("audio"); if (!a.src) return; follow = true; a.currentTime = Math.max(t, 0); a.play(); onTick(); }

function onTick(force){
  if (!curJob) return;
  const a = $("audio"), dur = Math.max(curJob.duration || 0, 1e-6), t = a.currentTime || 0;
  const ph = $("ph");
  const shown = a.src !== "" && !a.classList.contains("hidden");
  ph.classList.toggle("hidden", !shown);
  if (shown) ph.style.left = Math.min(100, t / dur * 100) + "%";
  const segs = curJob.segments;
  let lo = 0, hi = segs.length - 1, i = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (segs[m].start <= t + 0.05) { i = m; lo = m + 1; } else hi = m - 1; }
  const rows = document.querySelectorAll("#segs .seg");
  for (let j = 0; j < rows.length; j++) rows[j].classList.toggle("cur", j === i);
  if (follow && i >= 0 && (i !== lastIdx || force) && rows[i]) {
    const box = $("segs"), br = box.getBoundingClientRect(), r = rows[i].getBoundingClientRect();
    if (r.top < br.top + 8 || r.bottom > br.bottom - 8)
      box.scrollTo({ top: box.scrollTop + (r.top - br.top) - (box.clientHeight - r.height) / 2, behavior: "smooth" });
  }
  lastIdx = i;
}

$("audio").addEventListener("timeupdate", () => onTick());
$("audio").addEventListener("seeked", () => { follow = true; onTick(true); });
["wheel", "touchmove"].forEach(ev => $("segs").addEventListener(ev, () => { follow = false; }, { passive: true }));

function escapeHtml(x){ return x.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function showStatus(msg, isErr){ const s=$("status"); s.classList.remove("hidden"); s.querySelector(".spin").style.display=isErr?"none":""; s.children[1].innerHTML=(isErr?'<span class="err">':'')+msg+(isErr?'</span>':''); }
function hideStatus(){ $("status").classList.add("hidden"); }
</script>
</body>
</html>
